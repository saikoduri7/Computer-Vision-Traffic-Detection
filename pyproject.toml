[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-detection"
version = "1.0.0"
description = "Colab-ready traffic detection, tracking, and line-crossing counts"
requires-python = ">=3.10"
dependencies = ["ultralytics>=8.3,<9", "opencv-python>=4.8,<5", "PyYAML>=6,<7", "lap>=0.5.12,<0.6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6"]

[project.scripts]
# Installed command-line entry point; Colab can also import the pipeline directly.
traffic-detect = "traffic_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
